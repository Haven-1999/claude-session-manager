<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Session Manager</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/xterm.css">
  <script type="importmap">
  {
    "imports": {
      "xterm": "./vendor/xterm.mjs",
      "xterm-addon-fit": "./vendor/xterm-addon-fit.mjs"
    }
  }
  </script>
</head>
<body data-theme="dark">
  <div id="app">
    <header class="top-bar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button id="btn-menu" class="menu-btn" title="Menu">☰</button>
        <span class="logo"><span class="logo-full">Claude Session Manager</span><span class="logo-short">CSM</span></span>
      </div>
      <div class="actions">
        <button id="btn-new">+ New Session</button>
        <button id="btn-shell" class="btn-secondary" title="Toggle current path terminal">Shell</button>
        <button id="btn-debug">Debug</button>
        <button id="btn-theme" title="Toggle theme">☀</button>
        <button id="btn-settings">Settings</button>
      </div>
    </header>
    <div class="main-layout">
      <aside id="session-list" class="sidebar left">
        <div class="session-list-content" id="session-list-content"></div>
        <div class="sidebar-header" style="border-top: 1px solid var(--border);">Info</div>
        <div id="session-info-content" class="session-info-content"></div>
      </aside>
      <main id="terminal-panel" class="terminal-area">
        <div id="terminal-panels"></div>
        <section id="shell-panel" class="shell-panel hidden" aria-label="Current path terminal">
          <div id="shell-resize-handle" class="shell-resize-handle" title="Resize shell terminal"></div>
          <div class="shell-header">
            <span id="shell-title">Current Path Shell</span>
            <button id="shell-collapse" title="Collapse shell terminal">Collapse</button>
          </div>
          <div id="shell-terminal" class="shell-terminal"></div>
        </section>
        <div id="connection-overlay" class="hidden"></div>
        <div id="debug-panel" class="debug-panel"></div>
      </main>
      <aside id="code-editor" class="sidebar right hidden">
        <div class="resize-handle" id="editor-resize-handle"></div>
        <div class="sidebar-header">Editor</div>
        <div class="code-editor-content" id="code-editor-content"></div>
      </aside>
    </div>
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal" style="width: 360px;">
        <h3>Settings</h3>
        <div class="field">
          <label>Theme</label>
          <div style="display: flex; gap: 12px; margin-top: 6px;">
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 400; font-size: 13px;">
              <input type="radio" name="theme" value="dark" checked> Dark
            </label>
            <label style="display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: 400; font-size: 13px;">
              <input type="radio" name="theme" value="light"> Light
            </label>
          </div>
        </div>
        <div class="field">
          <label for="settings-font-size">Terminal Font Size</label>
          <div style="display: flex; align-items: center; gap: 10px;">
            <input type="range" id="settings-font-size" min="10" max="22" value="14" style="flex: 1;">
            <span id="settings-font-value" style="min-width: 28px; text-align: right; font-family: Menlo, monospace;">14</span>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" id="settings-reset">Reset to Defaults</button>
          <button class="btn-primary" id="settings-close">Close</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
