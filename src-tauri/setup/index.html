<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSM Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #cccccc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p {
      margin-bottom: 24px;
      color: #888888;
    }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #aaaaaa;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      background: #2d2d2d;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      color: #cccccc;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #007acc;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #005f9e;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status.error {
      display: block;
      background: #3c1e1e;
      color: #ff6b6b;
      border: 1px solid #5c2e2e;
    }
    .status.success {
      display: block;
      background: #1e3c1e;
      color: #6bff6b;
      border: 1px solid #2e5c2e;
    }
    .status.loading {
      display: block;
      background: #2d2d2d;
      color: #cccccc;
      border: 1px solid #3c3c3c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Claude Session Manager</h1>
    <p>Connect to your remote CSM server</p>

    <div class="field">
      <label>SSH Host</label>
      <input type="text" id="host" placeholder="your-server.com" />
    </div>

    <div class="field">
      <label>SSH User</label>
      <input type="text" id="user" placeholder="root" />
    </div>

    <div class="row">
      <div class="field">
        <label>SSH Port</label>
        <input type="number" id="ssh-port" value="22" />
      </div>
      <div class="field">
        <label>Remote CSM Port</label>
        <input type="number" id="remote-port" value="8080" />
      </div>
    </div>

    <div class="field">
      <label>Local Port</label>
      <input type="number" id="local-port" value="18080" />
    </div>

    <div class="field">
      <label>SSH Identity File</label>
      <input type="text" id="identity" placeholder="~/.ssh/id_rsa" />
    </div>

    <button id="connect-btn">Connect</button>
    <div id="status" class="status"></div>
  </div>

  <script type="module" src="setup.js"></script>
</body>
</html>
